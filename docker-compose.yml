services:
  # Servidor Redis en memoria para almacenamiento atómico del Rate Limiting distribuido
  redis:
    image: redis:7-alpine
    container_name: apigateway-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway-network

  # Microservicio backend de catálogo (aislado internamente, sin puerto público en el host)
  catalog-service:
    image: catalog-service:latest
    container_name: apigateway-catalog-service
    build:
      context: .
      dockerfile: src/Services/CatalogService/Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
    networks:
      - gateway-network

  catalog-service-2:
    image: catalog-service:latest
    container_name: apigateway-catalog-service-2
    build:
      context: .
      dockerfile: src/Services/CatalogService/Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8082
    networks:
      - gateway-network

  orders-service:
    image: orders-service:latest
    container_name: apigateway-orders-service
    build:
      context: .
      dockerfile: src/Services/OrdersService/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8083
    networks:
      - gateway-network

  auth-service:
    image: auth-service:latest
    container_name: apigateway-auth-service
    build:
      context: .
      dockerfile: src/Services/AuthService/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8085
    networks:
      - gateway-network

  # API Gateway con YARP (Punto único de entrada público expuesto en el puerto 5000)
  api-gateway:
    image: api-gateway:latest
    container_name: apigateway-proxy
    build:
      context: .
      dockerfile: src/Gateway/ApiGateway/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Redis=redis:6379
      - ReverseProxy__Clusters__catalog-cluster__Destinations__catalog-service-node__Address=http://catalog-service:8080
      - RateLimiting__Enabled=true
    depends_on:
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_started
      orders-service:
        condition: service_started
    volumes:
      - ./src/Gateway/ApiGateway/appsettings.json:/app/appsettings.json:ro
    networks:
      - gateway-network

    # Exportador de métricas de Redis para Prometheus (Observabilidad de Producción)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: apigateway-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gateway-network

  # Interfaz visual oficial de Redis (Para inspeccionar llaves y TTLs en vivo)
  redis-insight:
    image: redis/redisinsight:latest
    container_name: apigateway-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gateway-network

  # Recolector y base de datos de series temporales (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: apigateway-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api-gateway
      - redis-exporter
    networks:
      - gateway-network

  # Plataforma de visualización y Dashboards en tiempo real (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: apigateway-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - gateway-network

volumes:
  grafana-data:

networks:
  gateway-network:
    driver: bridge
