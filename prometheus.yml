global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 1. Recolectar métricas de nuestro API Gateway (.NET 8 + YARP)
  - job_name: "api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-gateway:8080"]

  # 2. Recolectar métricas operativas de Redis en producción
  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]